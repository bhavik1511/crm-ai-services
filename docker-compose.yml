version: '3.8'

services:
  crm-ai-service:
    build: .
    container_name: crm-ai-services
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional local MongoDB container if not using MongoDB Atlas
  mongo:
    image: mongo:latest
    container_name: crm-ai-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:

